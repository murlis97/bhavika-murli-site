<main class="rsvp">
  <section class="hero" id="rsvp-access-locked">
    <div class="arch-card">
      <img class="crest" src="images/ganesha-crest.png" alt="Ganesha">
      <p class="footer-mark"><span class="footer-initials">B</span><span class="footer-amp">&amp;</span><span class="footer-initials">M</span></p>
      <p>This RSVP form is shared privately through each guest's invitation code.</p>
      <form id="guest-rsvp-form" class="guest-rsvp-form">
      <label for="guest-access-code">Enter your invitation code</label>
      <div class="guest-rsvp-controls">
        <input type="text" id="guest-access-code" name="guestCode" autocomplete="off" placeholder="Invitation code" required>
        <button type="submit" class="cta cta-outline">Continue to RSVP</button>
      </div>
      <p id="guest-rsvp-status" class="form-status" role="status" aria-live="polite"></p>
    </form>
    </div>
  </section>
